<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ตอบถูกรับเงิน</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1620; --card:#132430; --card2:#1A3140; --ink:#EAF3F0; --muted:#8FA6A8;
  --line:rgba(255,255,255,.12); --jade:#22D39A; --jade-ink:#05261B; --gold:#FFC83D; --coral:#FF6B5B;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#EAF4F0; --card:#FFFFFF; --card2:#F1F7F5; --ink:#0F2A2A; --muted:#5D7777;
  --line:rgba(15,42,42,.14); --jade:#12A874; --jade-ink:#FFFFFF; --gold:#C98A00; --coral:#E5483A;
  --shadow:0 10px 24px rgba(15,42,42,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt',system-ui,sans-serif;font-size:15px;line-height:1.5}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--jade);color:var(--jade-ink);display:grid;place-items:center;font-weight:700;flex:none}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs button{background:none;padding:9px;border-radius:11px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--jade);color:var(--jade-ink);font-weight:600}

/* ticket */
.ticket{display:grid;grid-template-columns:1fr 108px;background:var(--card);border-radius:18px;margin-bottom:16px;position:relative;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.ticket:active{transform:scale(.985)}
.ticket::before,.ticket::after{content:"";position:absolute;right:99px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.t-main{padding:16px 14px 16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.t-q{margin:0;font-weight:600;font-size:16px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.t-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.bar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--jade);border-radius:6px;transition:width .4s}
.t-stub{border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px;text-align:center;gap:0}
.t-stub b{font-size:28px;line-height:1.1;color:var(--gold);font-weight:700}
.t-stub span{font-size:12px;color:var(--muted)}
.t-stub em{font-style:normal;margin-top:8px;font-size:13px;font-weight:600}
.ticket.is-closed{opacity:.6}
.ticket.is-closed .t-stub b{color:var(--muted)}
.chip{font-size:12px;padding:1px 9px;border-radius:999px;background:var(--card2);font-weight:500}
.chip.open{background:rgba(34,211,154,.18);color:var(--jade)}
.chip.closed{background:rgba(255,107,91,.16);color:var(--coral)}
.chip.won{background:rgba(255,200,61,.2);color:var(--gold)}

.empty{text-align:center;color:var(--muted);padding:56px 24px;border:2px dashed var(--line);border-radius:20px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{display:block;width:100%;padding:14px 18px;border-radius:14px;background:var(--jade);color:var(--jade-ink);font-weight:700;font-size:16px;text-align:center}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card2);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;color:var(--coral);border:1.5px solid var(--coral);font-weight:600}
.dock .btn{max-width:560px;margin:0 auto}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 24px);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 16px}
.sheet h2{margin:0 0 4px;font-size:21px;line-height:1.3}
.field{margin-top:16px}
.field label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:5px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,textarea:focus{outline:none;border-color:var(--jade)}
textarea{resize:vertical;min-height:90px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.total{margin-top:18px;background:var(--card);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.total b{font-size:24px;color:var(--gold)}
.actions{margin-top:20px;display:grid;gap:10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--card);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.stat.gold b{color:var(--gold)}
.winner{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.winner .n{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:600;font-size:14px}
.winner.paid .n{background:var(--jade);color:var(--jade-ink)}
.winner p{margin:0;line-height:1.3}.winner small{color:var(--muted);font-size:13px}
.mini{padding:8px 12px;border-radius:10px;background:var(--jade);color:var(--jade-ink);font-weight:600;font-size:13px}
.winner.paid .mini{background:var(--card2);color:var(--muted)}
.sec{margin:22px 0 10px;font-weight:600;font-size:16px}

.result{text-align:center;padding:20px 4px 4px}
.result .big{font-size:56px;line-height:1}
.result h2{margin-top:10px}
.result p{color:var(--muted);margin:8px 0 0}

.qrbox{background:#fff;border-radius:18px;padding:14px;width:min(280px,100%);margin:16px auto 8px}
.qrbox svg{display:block;width:100%;height:auto}
.center{text-align:center}
.amt{font-size:34px;font-weight:700;color:var(--gold);line-height:1.2}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:50;opacity:0;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.setup{background:var(--card);border-radius:18px;padding:20px;margin-top:20px}
.setup code{background:var(--card2);padding:1px 6px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock" id="dock"><button class="btn" data-action="new">+ ตั้งคำถามใหม่</button></div>
<div class="toast" id="toast" role="status"></div>
<div id="layer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, addDoc, getDoc, getDocs, deleteDoc, updateDoc, query,
  orderBy, limit, onSnapshot, runTransaction, serverTimestamp, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ ใส่ Firebase config ของคุณตรงนี้ ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCkOVdwJWojhg_k2D5PKPw-f4U0QIl1Ngo",
      authDomain: "staff-food-order-app.firebaseapp.com",
      projectId: "staff-food-order-app",
      storageBucket: "staff-food-order-app.firebasestorage.app",
      messagingSenderId: "481469158693",
      appId: "1:481469158693:web:49acc11ec56bfde58776cc",
      measurementId: "G-NLP53Z198E"
};
/* ======================================================== */

const tg = window.Telegram?.WebApp;
const inTG = !!(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.theme = tg.colorScheme || 'dark'; }

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });

/* ---------- ผู้ใช้ ---------- */
const tu = tg?.initDataUnsafe?.user;
let devId = localStorage.getItem('devId');
if (!devId) { devId = String(Math.floor(Math.random() * 1e9)); localStorage.setItem('devId', devId); }
const me = tu
  ? { id: String(tu.id), name: [tu.first_name, tu.last_name].filter(Boolean).join(' ') }
  : { id: devId, name: 'ผู้ทดสอบ' };

/* ---------- state ---------- */
const state = { tab: 'open', qs: [], ready: false };
const won = new Set(JSON.parse(localStorage.getItem('won') || '[]'));
let db, unsubWinners = null;

/* ---------- helpers ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function haptic(type = 'success') { tg?.HapticFeedback?.notificationOccurred?.(type); }
function ask(msg, cb) {
  if (inTG && tg.showConfirm) tg.showConfirm(msg, ok => ok && cb());
  else if (confirm(msg)) cb();
}
async function sha(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const randHex = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join('');

/* ---------- PromptPay QR ---------- */
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1);
    c &= 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function ppPayload(target, amount) {
  target = String(target).replace(/\D/g, '');
  const acct = target.length === 13 ? tlv('02', target) : tlv('01', '0066' + target.replace(/^0/, ''));
  const body = tlv('00', '01') + tlv('01', '12')
    + tlv('29', tlv('00', 'A000000677010111') + acct)
    + tlv('53', '764') + tlv('54', Number(amount).toFixed(2)) + tlv('58', 'TH') + '6304';
  return body + crc16(body);
}
function qrSvg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
}

/* ---------- sheet ---------- */
function openSheet(html, onClose) {
  closeSheet();
  const l = $('#layer');
  l.innerHTML = `<div class="scrim" data-action="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  l._onClose = onClose;
  document.body.style.overflow = 'hidden';
  return l.querySelector('.sheet');
}
function closeSheet() {
  const l = $('#layer');
  if (l._onClose) { l._onClose(); l._onClose = null; }
  l.innerHTML = ''; document.body.style.overflow = '';
}

/* ---------- render list ---------- */
function render() {
  const app = $('#app');
  const initial = esc((me.name || '?').trim().charAt(0).toUpperCase());
  let items = state.tab === 'open' ? state.qs.filter(q => q.status === 'open') : state.qs.filter(q => q.ownerId === me.id);
  const list = !state.ready ? `<div class="empty">กำลังโหลด…</div>`
    : items.length ? items.map(ticket).join('')
    : state.tab === 'open'
      ? `<div class="empty"><b>ยังไม่มีคำถามที่เปิดอยู่</b>กดปุ่มด้านล่างเพื่อตั้งคำถามแรกและแจกเงินได้เลย</div>`
      : `<div class="empty"><b>คุณยังไม่ได้ตั้งคำถาม</b>ตั้งคำถามแล้วระบบจะเปิดให้คนตอบทันที</div>`;
  app.innerHTML = `
    <header>
      <div><h1>ตอบถูก รับเงิน</h1><p class="sub">ตอบให้ตรงเป๊ะ แล้วรับเงินผ่านพร้อมเพย์ หรือทรูมันนี่</p></div>
      <div class="avatar" aria-hidden="true">${initial}</div>
    </header>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${state.tab === 'open'}" data-action="tab" data-tab="open">คำถามที่เปิดอยู่</button>
      <button role="tab" aria-selected="${state.tab === 'mine'}" data-action="tab" data-tab="mine">คำถามของฉัน</button>
    </div>
    <section>${list}</section>`;
}
function ticket(q) {
  const closed = q.status !== 'open';
  const pct = Math.min(100, Math.round(q.winnersCount / q.winnerLimit * 100));
  const mine = q.ownerId === me.id;
  const chip = closed ? `<span class="chip closed">ปิดแล้ว</span>`
    : won.has(q.id) ? `<span class="chip won">คุณตอบถูกแล้ว</span>`
    : `<span class="chip open">เปิดอยู่</span>`;
  return `<article class="ticket ${closed ? 'is-closed' : ''}" data-action="open" data-id="${q.id}">
    <div class="t-main">
      <p class="t-q">${esc(q.text)}</p>
      <div class="t-meta"><span>${mine ? 'ของคุณ' : esc(q.ownerName)}</span>${chip}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="t-stub"><b>฿${fmt(q.amountEach)}</b><span>ต่อคน</span><em>${q.winnersCount}/${q.winnerLimit} คน</em></div>
  </article>`;
}

/* ---------- สร้างคำถาม ---------- */
function newSheet() {
  const s = openSheet(`
    <h2>ตั้งคำถามใหม่</h2><p class="sub">เมื่อยืนยันแล้ว คำถามจะเปิดให้ตอบทันที</p>
    <div class="field"><label for="f-q">คำถาม</label><textarea id="f-q" maxlength="500" placeholder="เช่น เมืองหลวงของญี่ปุ่นคืออะไร"></textarea></div>
    <div class="field"><label for="f-a">คำตอบที่ถูกต้อง</label><input id="f-a" autocomplete="off" placeholder="พิมพ์คำตอบที่ถูก">
      <small>ผู้ตอบต้องพิมพ์ตรงทุกตัวอักษรจึงจะนับว่าถูก (ตัดช่องว่างหน้า-หลังให้)</small></div>
    <div class="row2">
      <div class="field"><label for="f-n">จำนวนคนที่ได้รับเงิน</label><input id="f-n" type="number" inputmode="numeric" min="1" max="1000" value="5"></div>
      <div class="field"><label for="f-m">เงินต่อคน (บาท)</label><input id="f-m" type="number" inputmode="decimal" min="1" value="50"></div>
    </div>
    <div class="total"><span>ยอดแจกรวม</span><b id="f-t">฿250</b></div>
    <div class="actions"><button class="btn" id="f-ok">ตั้งคำถามและเปิดให้ตอบ</button><button class="btn ghost" data-action="close">ยกเลิก</button></div>`);
  const calc = () => { $('#f-t', s).textContent = '฿' + fmt((+$('#f-n', s).value || 0) * (+$('#f-m', s).value || 0)); };
  $('#f-n', s).oninput = calc; $('#f-m', s).oninput = calc;
  $('#f-ok', s).onclick = () => {
    const text = $('#f-q', s).value.trim(), answer = $('#f-a', s).value.trim();
    const n = parseInt($('#f-n', s).value, 10), m = parseFloat($('#f-m', s).value);
    if (!text) return toast('กรอกคำถามก่อน');
    if (!answer) return toast('กรอกคำตอบที่ถูกต้อง');
    if (!(n >= 1 && n <= 1000)) return toast('จำนวนคนต้อง 1–1,000');
    if (!(m > 0)) return toast('ใส่ยอดเงินต่อคน');
    ask(`ยืนยันตั้งคำถามนี้?\nแจก ${n} คน คนละ ฿${fmt(m)} (รวม ฿${fmt(n * m)})\nคำถามจะเปิดให้ตอบทันที`, async () => {
      const btn = $('#f-ok', s); btn.disabled = true; btn.textContent = 'กำลังสร้าง…';
      try {
        const salt = randHex();
        await addDoc(collection(db, 'questions'), {
          ownerId: me.id, ownerName: me.name, text, salt, answerHash: await sha(salt + answer),
          winnerLimit: n, amountEach: m, winnersCount: 0, status: 'open', createdAt: serverTimestamp()
        });
        haptic(); closeSheet(); state.tab = 'mine'; render(); toast('เปิดรับคำตอบแล้ว');
      } catch (e) { console.error(e); btn.disabled = false; btn.textContent = 'ตั้งคำถามและเปิดให้ตอบ'; toast('สร้างไม่สำเร็จ ตรวจสอบ Firestore rules'); }
    });
  };
}

/* ---------- ตอบคำถาม ---------- */
async function answerSheet(q) {
  const s = openSheet(`
    <h2>${esc(q.text)}</h2>
    <p class="sub">ตอบถูกรับ <b style="color:var(--gold)">฿${fmt(q.amountEach)}</b> · เหลือ ${q.winnerLimit - q.winnersCount} จาก ${q.winnerLimit} สิทธิ์</p>
    <div class="field"><label for="a-name">ชื่อ</label><input id="a-name" autocomplete="name" value="${esc(me.name)}"></div>
    <div class="field"><label for="a-pp">พร้อมเพย์ หรือ ทรูมันนี่ (บัญชีธนาคาร อดนะ!)</label><input id="a-pp" inputmode="numeric" autocomplete="off" placeholder="เบอร์มือถือ 10 หลัก หรือเลขบัตร 13 หลัก">
      <small>ใช้สำหรับรับเงินเท่านั้น ผู้ตั้งคำถามจะเห็นเฉพาะคนที่ตอบถูก</small></div>
    <div class="field"><label for="a-ans">คำตอบ</label><input id="a-ans" autocomplete="off" placeholder="พิมพ์คำตอบของคุณ"></div>
    <div class="actions"><button class="btn" id="a-ok">ส่งคำตอบ</button><button class="btn ghost" data-action="close">ปิด</button></div>`,
    () => { unsubQ && unsubQ(); });
  // แจ้งเตือนถ้าคำถามเต็มระหว่างที่กำลังตอบ
  const unsubQ = onSnapshot(doc(db, 'questions', q.id), snap => {
    const d = snap.data();
    if (!d || d.status !== 'open') { if ($('#a-ok')) { $('#a-ok').disabled = true; $('#a-ok').textContent = 'คำถามนี้ปิดแล้ว'; toast('ครบจำนวนแล้ว คำถามนี้ปิดรับคำตอบ'); haptic('warning'); } }
  });
  $('#a-ok', s).onclick = async () => {
    const name = $('#a-name', s).value.trim(), pp = $('#a-pp', s).value.replace(/\D/g, ''), ans = $('#a-ans', s).value.trim();
    if (!name) return toast('กรอกชื่อ');
    if (pp.length !== 10 && pp.length !== 13) return toast('พร้อมเพย์ต้องเป็นเบอร์ 10 หลัก หรือเลขบัตร 13 หลัก');
    if (!ans) return toast('กรอกคำตอบ');
    const btn = $('#a-ok', s); btn.disabled = true; btn.textContent = 'กำลังตรวจ…';
    try {
      const r = await submitAnswer(q, name, pp, ans);
      if (r === 'wrong') { haptic('error'); toast('คำตอบไม่ถูกต้อง ลองใหม่อีกครั้ง'); btn.disabled = false; btn.textContent = 'ส่งคำตอบ'; }
      else if (r === 'closed' || r === 'gone') { haptic('warning'); resultSheet('🔒', 'คำถามนี้ปิดแล้ว', 'มีคนตอบถูกครบจำนวนแล้ว'); }
      else if (r === 'dup') { resultSheet('✅', 'คุณตอบถูกไปแล้ว', 'ผู้ตั้งคำถามจะโอนเงินให้ตามพร้อมเพย์ที่คุณกรอก'); }
      else {
        won.add(q.id); localStorage.setItem('won', JSON.stringify([...won])); haptic();
        resultSheet('🎉', 'ตอบถูก!', `คุณได้รับ ฿${fmt(q.amountEach)} ผู้ตั้งคำถามจะโอนเข้าพร้อมเพย์ ${esc(pp)}`);
      }
    } catch (e) { console.error(e); toast('ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'); btn.disabled = false; btn.textContent = 'ส่งคำตอบ'; }
  };
}
async function submitAnswer(q, name, pp, ans) {
  if ((await sha(q.salt + ans)) !== q.answerHash) return 'wrong';
  const qref = doc(db, 'questions', q.id), wref = doc(db, 'questions', q.id, 'winners', me.id);
  return runTransaction(db, async tx => {
    const qs = await tx.get(qref);
    if (!qs.exists()) return 'gone';
    const d = qs.data();
    if (d.status !== 'open' || d.winnersCount >= d.winnerLimit) return 'closed';
    if ((await tx.get(wref)).exists()) return 'dup';
    const n = d.winnersCount + 1;
    tx.set(wref, { userId: me.id, name, promptpay: pp, paid: false, createdAt: serverTimestamp() });
    tx.update(qref, { winnersCount: n, status: n >= d.winnerLimit ? 'closed' : 'open' });
    return n >= d.winnerLimit ? 'last' : 'won';
  });
}
function resultSheet(icon, title, text) {
  openSheet(`<div class="result"><div class="big">${icon}</div><h2>${title}</h2><p>${text}</p></div>
    <div class="actions"><button class="btn" data-action="close">เรียบร้อย</button></div>`);
}

/* ---------- เจ้าของคำถาม ---------- */
function ownerSheet(q) {
  const s = openSheet(`
    <h2>${esc(q.text)}</h2>
    <div class="stats">
      <div class="stat"><b id="o-cnt">${q.winnersCount}/${q.winnerLimit}</b><span>ตอบถูก (คน)</span></div>
      <div class="stat gold"><b>฿${fmt(q.amountEach)}</b><span>ต่อคน</span></div>
      <div class="stat gold"><b>฿${fmt(q.amountEach * q.winnerLimit)}</b><span>ยอดรวม</span></div>
    </div>
    <div id="o-status"></div>
    <div class="sec">คนที่ตอบถูก</div>
    <div id="o-list"><div class="empty">ยังไม่มีคนตอบถูก</div></div>
    <div class="actions"><button class="btn danger" id="o-del">ลบคำถามนี้</button><button class="btn ghost" data-action="close">ปิด</button></div>`,
    () => { unsubWinners && unsubWinners(); unsubWinners = null; unsubQ && unsubQ(); });
  let winners = [];
  const unsubQ = onSnapshot(doc(db, 'questions', q.id), snap => {
    const d = snap.data(); if (!d) return;
    $('#o-cnt', s).textContent = `${d.winnersCount}/${d.winnerLimit}`;
    $('#o-status', s).innerHTML = d.status === 'open'
      ? `<span class="chip open">เปิดรับคำตอบอยู่</span>`
      : `<span class="chip closed">ครบจำนวนแล้ว · ปิดคำถามแล้ว</span>`;
  });
  unsubWinners = onSnapshot(query(collection(db, 'questions', q.id, 'winners'), orderBy('createdAt', 'asc')), snap => {
    winners = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    $('#o-list', s).innerHTML = winners.length ? winners.map((w, i) => `
      <div class="winner ${w.paid ? 'paid' : ''}">
        <div class="n">${w.paid ? '✓' : i + 1}</div>
        <div><p>${esc(w.name)}</p><small>${esc(w.promptpay)}</small></div>
        <button class="mini" data-act="qr" data-wid="${w.id}">${w.paid ? 'ดู QR' : 'QR โอนเงิน'}</button>
      </div>`).join('') : `<div class="empty">ยังไม่มีคนตอบถูก</div>`;
  });
  s.addEventListener('click', e => {
    const b = e.target.closest('[data-act="qr"]'); if (!b) return;
    const w = winners.find(x => x.id === b.dataset.wid); if (w) qrDialog(q, w);
  });
  $('#o-del', s).onclick = () => ask('ลบคำถามนี้และรายชื่อผู้ตอบถูกทั้งหมด? ย้อนกลับไม่ได้', async () => {
    try {
      const ws = await getDocs(collection(db, 'questions', q.id, 'winners'));
      const batch = writeBatch(db);
      ws.forEach(d => batch.delete(d.ref));
      batch.delete(doc(db, 'questions', q.id));
      await batch.commit();
      closeSheet(); toast('ลบคำถามแล้ว');
    } catch (e) { console.error(e); toast('ลบไม่สำเร็จ'); }
  });
}
function qrDialog(q, w) {
  const d = document.createElement('div');
  d.className = 'scrim'; d.style.alignItems = 'center'; d.style.zIndex = 30;
  d.innerHTML = `<div class="sheet center" style="border-radius:24px;max-width:360px;animation:up .2s">
    <h2>โอนให้ ${esc(w.name)}</h2>
    <div class="amt">฿${fmt(q.amountEach)}</div>
    <div class="qrbox">${qrSvg(ppPayload(w.promptpay, q.amountEach))}</div>
    <p class="sub">พร้อมเพย์ ${esc(w.promptpay)}<br>สแกนด้วยแอปธนาคาร ยอดเงินใส่ให้อัตโนมัติ</p>
    <div class="actions">
      <button class="btn" id="q-paid">${w.paid ? 'ยกเลิกสถานะ โอนแล้ว' : 'ทำเครื่องหมาย โอนแล้ว'}</button>
      <button class="btn ghost" id="q-x">ปิด</button>
    </div></div>`;
  document.body.appendChild(d);
  d.querySelector('#q-x').onclick = () => d.remove();
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.querySelector('#q-paid').onclick = async () => {
    await updateDoc(doc(db, 'questions', q.id, 'winners', w.id), { paid: !w.paid });
    d.remove(); toast(w.paid ? 'ยกเลิกสถานะแล้ว' : 'บันทึกว่าโอนแล้ว');
  };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'scrim') { if (e.target === el) closeSheet(); }
  else if (a === 'close') closeSheet();
  else if (a === 'new') newSheet();
  else if (a === 'tab') { state.tab = el.dataset.tab; render(); }
  else if (a === 'open') {
    const q = state.qs.find(x => x.id === el.dataset.id); if (!q) return;
    if (q.ownerId === me.id) ownerSheet(q);
    else if (q.status !== 'open') toast('คำถามนี้ปิดแล้ว');
    else if (won.has(q.id)) toast('คุณตอบถูกข้อนี้ไปแล้ว');
    else answerSheet(q);
  }
});

/* ---------- boot ---------- */
function boot() {
  if (firebaseConfig.apiKey.startsWith('YOUR_')) {
    $('#dock').style.display = 'none';
    $('#app').innerHTML = `<header><h1>ตอบถูก รับเงิน</h1></header>
      <div class="setup"><b>ยังไม่ได้ตั้งค่า Firebase</b><p class="sub">เปิดไฟล์ <code>index.html</code> แล้วแก้ <code>firebaseConfig</code> ด้านบนสุดของสคริปต์ให้เป็นค่าของโปรเจกต์คุณ</p></div>`;
    return;
  }
  db = getFirestore(initializeApp(firebaseConfig));
  render();
  const prev = new Map();
  onSnapshot(query(collection(db, 'questions'), orderBy('createdAt', 'desc'), limit(100)), snap => {
    state.qs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.ready = true;
    // แจ้งเจ้าของเมื่อคำถามของตัวเองครบจำนวน
    state.qs.forEach(q => {
      if (q.ownerId === me.id && prev.get(q.id) === 'open' && q.status === 'closed') {
        toast('🎉 คำถามของคุณมีคนตอบถูกครบแล้ว ปิดคำถามให้แล้ว'); haptic();
        tg?.showAlert?.(`ครบจำนวนแล้ว!\n"${q.text.slice(0, 60)}"\nเปิดดูรายชื่อและโอนเงินได้ในแท็บ "คำถามของฉัน"`);
      }
      prev.set(q.id, q.status);
    });
    render();
  }, err => { console.error(err); state.ready = true; render(); toast('โหลดข้อมูลไม่ได้ ตรวจสอบ Firestore rules'); });
}
boot();
</script>
